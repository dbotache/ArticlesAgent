[project]
name = "articles-agent"
version = "0.1.0"
description = "RAG over a Zotero library with page-accurate citations"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pymupdf4llm>=1.27",
    "pymupdf>=1.24",
    "bibtexparser==1.4.3",
    "pyyaml>=6",
    "tqdm>=4",
    "python-dotenv>=1",
    "openai>=1.50",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "pydantic>=2",
    "chromadb>=1.0",
    "rank-bm25>=0.2",
    "numpy>=1.26",
    "langgraph>=1.0",
    "rapidfuzz>=3",
    "streamlit>=1.40",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-timeout>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/articles_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: starts the real Streamlit server or subprocesses (slower)",
    "live: calls the real Azure OpenAI deployments (opt-in: ARTICLES_AGENT_LIVE_TESTS=1)",
]
timeout = 300
filterwarnings = [
    "ignore::DeprecationWarning:bibtexparser.*",
    "ignore::DeprecationWarning:pyparsing.*",
]
